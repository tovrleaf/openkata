<svg xmlns="http://www.w3.org/2000/svg" id="aw-agents" viewBox="0 0 440 390" width="503" role="img" aria-labelledby="aw-agents-title">
  <title id="aw-agents-title">Agent responsibilities: the user works through dojo-master, or one to one with spec-planner. dojo-master delegates to frontend-developer, backend-developer, spec-validator, adr-author and kata-author.</title>
  <style>
    #aw-agents { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-agents .box { fill: var(--color-surface-raised, #fff); stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-agents .end { fill: var(--color-surface, #fcfcfc); stroke: var(--color-ink, #0a0a0a); stroke-width: 1.25; }
    #aw-agents .choice { fill: var(--color-surface-raised, #fff); stroke: var(--color-accent-muted, #4a7fa5); stroke-width: 1.5; }
    #aw-agents .edge { fill: none; stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-agents .head { fill: var(--color-ink-muted, #6b6b6b); }
    #aw-agents text { fill: var(--color-ink, #0a0a0a); text-anchor: middle; }
    #aw-agents .note { fill: var(--color-ink-muted, #6b6b6b); font-size: 12px; }
    #aw-agents .strong { font-weight: 600; }
    #aw-agents .dashed { stroke-dasharray: 5 4; }
    #aw-agents .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
    #aw-agents { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-agents .box { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-agents .end { fill: var(--color-surface, #1a1a2e); stroke: var(--color-ink, #f0eeeb); stroke-width: 1.25; }
    #aw-agents .choice { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-accent-muted, #5a9fd4); stroke-width: 1.5; }
    #aw-agents .edge { fill: none; stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-agents .head { fill: var(--color-ink-muted, #a0a0a0); }
    #aw-agents text { fill: var(--color-ink, #f0eeeb); text-anchor: middle; }
    #aw-agents .note { fill: var(--color-ink-muted, #a0a0a0); font-size: 12px; }
    }
  </style>
  <defs>
    <marker id="aw-agents-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="end" x="170" y="10" width="100" height="36" rx="18.0"/>
  <text x="220" y="33">User</text>
  <path class="edge" d="M200,46 V70 H120 V96" marker-end="url(#aw-agents-arrow)"/>
  <path class="edge dashed" d="M240,46 V70 H330 V96" marker-end="url(#aw-agents-arrow)"/>
  <text class="note" x="285" y="62">direct 1-1</text>
  <rect class="box" x="40" y="96" width="160" height="40" rx="3"/>
  <text x="120" y="121">dojo-master</text>
  <rect class="box" x="255" y="96" width="150" height="40" rx="3"/>
  <text x="330" y="121">spec-planner</text>
  <path class="edge" d="M70,136 V362"/>
  <path class="edge" d="M70,178 H100" marker-end="url(#aw-agents-arrow)"/>
  <rect class="box" x="100" y="160" width="180" height="36" rx="3"/>
  <text x="190" y="183">frontend-developer</text>
  <path class="edge" d="M70,224 H100" marker-end="url(#aw-agents-arrow)"/>
  <rect class="box" x="100" y="206" width="180" height="36" rx="3"/>
  <text x="190" y="229">backend-developer</text>
  <path class="edge" d="M70,270 H100" marker-end="url(#aw-agents-arrow)"/>
  <rect class="box" x="100" y="252" width="180" height="36" rx="3"/>
  <text x="190" y="275">spec-validator</text>
  <path class="edge" d="M70,316 H100" marker-end="url(#aw-agents-arrow)"/>
  <rect class="box" x="100" y="298" width="180" height="36" rx="3"/>
  <text x="190" y="321">adr-author</text>
  <path class="edge" d="M70,362 H100" marker-end="url(#aw-agents-arrow)"/>
  <rect class="box" x="100" y="344" width="180" height="36" rx="3"/>
  <text x="190" y="367">kata-author</text>
</svg>
