<svg xmlns="http://www.w3.org/2000/svg" id="aw-routing" viewBox="0 0 480 612" width="549" role="img" aria-labelledby="aw-routing-title">
  <title id="aw-routing-title">Routing: a planning request switches to spec-planner. Anything else goes to dojo-master, which sends templates, CSS and JS to frontend-developer, handlers, types and tests to backend-developer, decisions to adr-author, conventions to kata-author and validation to spec-validator.</title>
  <style>
    #aw-routing { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-routing .box { fill: var(--color-surface-raised, #fff); stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-routing .end { fill: var(--color-surface, #fcfcfc); stroke: var(--color-ink, #0a0a0a); stroke-width: 1.25; }
    #aw-routing .choice { fill: var(--color-surface-raised, #fff); stroke: var(--color-accent-muted, #4a7fa5); stroke-width: 1.5; }
    #aw-routing .edge { fill: none; stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-routing .head { fill: var(--color-ink-muted, #6b6b6b); }
    #aw-routing text { fill: var(--color-ink, #0a0a0a); text-anchor: middle; }
    #aw-routing .note { fill: var(--color-ink-muted, #6b6b6b); font-size: 12px; }
    #aw-routing .strong { font-weight: 600; }
    #aw-routing .dashed { stroke-dasharray: 5 4; }
    #aw-routing .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
    #aw-routing { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-routing .box { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-routing .end { fill: var(--color-surface, #1a1a2e); stroke: var(--color-ink, #f0eeeb); stroke-width: 1.25; }
    #aw-routing .choice { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-accent-muted, #5a9fd4); stroke-width: 1.5; }
    #aw-routing .edge { fill: none; stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-routing .head { fill: var(--color-ink-muted, #a0a0a0); }
    #aw-routing text { fill: var(--color-ink, #f0eeeb); text-anchor: middle; }
    #aw-routing .note { fill: var(--color-ink-muted, #a0a0a0); font-size: 12px; }
    }
  </style>
  <defs>
    <marker id="aw-routing-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="end" x="45" y="10" width="110" height="36" rx="18.0"/>
  <text x="100" y="33">Request</text>
  <path class="edge" d="M100,46 V72" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="100,72 160,100 100,128 40,100"/>
  <text x="100" y="105">Planning?</text>
  <path class="edge" d="M160,100 H230" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="195" y="93">yes</text>
  <rect class="box" x="230" y="80" width="220" height="40" rx="3"/>
  <text x="340" y="105">Switch to spec-planner</text>
  <path class="edge" d="M100,128 V166" marker-end="url(#aw-routing-arrow)"/>
  <text class="note start" x="108" y="152">no</text>
  <rect class="box" x="20" y="166" width="160" height="40" rx="3"/>
  <text x="100" y="191">dojo-master</text>
  <path class="edge" d="M30,206 V570"/>
  <path class="edge" d="M30,250 H55" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="150,216 245,250 150,284 55,250"/>
  <text x="150" y="246">Templates,</text>
  <text x="150" y="264">CSS, JS?</text>
  <path class="edge" d="M245,250 H300" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="272" y="243">yes</text>
  <rect class="box" x="300" y="230" width="170" height="40" rx="3"/>
  <text x="385" y="255">frontend-developer</text>
  <path class="edge" d="M30,330 H55" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="150,296 245,330 150,364 55,330"/>
  <text x="150" y="326">Handlers,</text>
  <text x="150" y="344">types, tests?</text>
  <path class="edge" d="M245,330 H300" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="272" y="323">yes</text>
  <rect class="box" x="300" y="310" width="170" height="40" rx="3"/>
  <text x="385" y="335">backend-developer</text>
  <path class="edge" d="M30,410 H55" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="150,376 245,410 150,444 55,410"/>
  <text x="150" y="415">Decision?</text>
  <path class="edge" d="M245,410 H300" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="272" y="403">yes</text>
  <rect class="box" x="300" y="390" width="170" height="40" rx="3"/>
  <text x="385" y="415">adr-author</text>
  <path class="edge" d="M30,490 H55" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="150,456 245,490 150,524 55,490"/>
  <text x="150" y="495">Convention?</text>
  <path class="edge" d="M245,490 H300" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="272" y="483">yes</text>
  <rect class="box" x="300" y="470" width="170" height="40" rx="3"/>
  <text x="385" y="495">kata-author</text>
  <path class="edge" d="M30,570 H55" marker-end="url(#aw-routing-arrow)"/>
  <polygon class="choice" points="150,536 245,570 150,604 55,570"/>
  <text x="150" y="575">Validate?</text>
  <path class="edge" d="M245,570 H300" marker-end="url(#aw-routing-arrow)"/>
  <text class="note" x="272" y="563">yes</text>
  <rect class="box" x="300" y="550" width="170" height="40" rx="3"/>
  <text x="385" y="575">spec-validator</text>
</svg>
