<svg xmlns="http://www.w3.org/2000/svg" id="aw-parallel" viewBox="0 0 460 362" width="526" role="img" aria-labelledby="aw-parallel-title">
  <title id="aw-parallel-title">dojo-master hands templates, CSS and JS to frontend-developer, and handlers, types and tests to backend-developer. Their work converges into integration tasks that both agents do in sequence.</title>
  <style>
    #aw-parallel { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-parallel .box { fill: var(--color-surface-raised, #fff); stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-parallel .end { fill: var(--color-surface, #fcfcfc); stroke: var(--color-ink, #0a0a0a); stroke-width: 1.25; }
    #aw-parallel .choice { fill: var(--color-surface-raised, #fff); stroke: var(--color-accent-muted, #4a7fa5); stroke-width: 1.5; }
    #aw-parallel .edge { fill: none; stroke: var(--color-ink-muted, #6b6b6b); stroke-width: 1.25; }
    #aw-parallel .head { fill: var(--color-ink-muted, #6b6b6b); }
    #aw-parallel text { fill: var(--color-ink, #0a0a0a); text-anchor: middle; }
    #aw-parallel .note { fill: var(--color-ink-muted, #6b6b6b); font-size: 12px; }
    #aw-parallel .strong { font-weight: 600; }
    #aw-parallel .dashed { stroke-dasharray: 5 4; }
    #aw-parallel .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
    #aw-parallel { font-family: var(--font-body, system-ui, sans-serif); font-size: 14px; }
    #aw-parallel .box { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-parallel .end { fill: var(--color-surface, #1a1a2e); stroke: var(--color-ink, #f0eeeb); stroke-width: 1.25; }
    #aw-parallel .choice { fill: var(--color-surface-raised, #2a2a3e); stroke: var(--color-accent-muted, #5a9fd4); stroke-width: 1.5; }
    #aw-parallel .edge { fill: none; stroke: var(--color-ink-muted, #a0a0a0); stroke-width: 1.25; }
    #aw-parallel .head { fill: var(--color-ink-muted, #a0a0a0); }
    #aw-parallel text { fill: var(--color-ink, #f0eeeb); text-anchor: middle; }
    #aw-parallel .note { fill: var(--color-ink-muted, #a0a0a0); font-size: 12px; }
    }
  </style>
  <defs>
    <marker id="aw-parallel-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="150" y="10" width="160" height="40" rx="3"/>
  <text x="230" y="35">dojo-master</text>
  <rect class="box" x="35" y="100" width="170" height="40" rx="3"/>
  <text x="120" y="125">frontend-developer</text>
  <rect class="box" x="255" y="100" width="170" height="40" rx="3"/>
  <text x="340" y="125">backend-developer</text>
  <path class="edge" d="M230,50 V72 H120 V100" marker-end="url(#aw-parallel-arrow)"/>
  <path class="edge" d="M230,72 H340 V100" marker-end="url(#aw-parallel-arrow)"/>
  <path class="edge" d="M120,140 V162"/>
  <text class="note" x="120" y="180">templates, CSS, JS</text>
  <path class="edge" d="M120,192 V240 H160" marker-end="url(#aw-parallel-arrow)"/>
  <path class="edge" d="M340,140 V162"/>
  <text class="note" x="340" y="180">handlers, types, tests</text>
  <path class="edge" d="M340,192 V240 H300" marker-end="url(#aw-parallel-arrow)"/>
  <rect class="box" x="160" y="220" width="140" height="40" rx="3"/>
  <text x="230" y="245">Converge</text>
  <path class="edge" d="M230,260 V300" marker-end="url(#aw-parallel-arrow)"/>
  <rect class="box" x="115" y="300" width="230" height="52" rx="3"/>
  <text class="strong" x="230" y="322">Integration tasks</text>
  <text class="note" x="230" y="340">both agents sequential</text>
</svg>
