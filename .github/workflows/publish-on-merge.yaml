name: Trigger publish after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  retrigger-tags:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Re-push artifact tags to trigger publish
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Find artifact tags pointing at commits in this PR
          pr_commits=$(git rev-list "${PR_BASE_SHA}..${PR_HEAD_SHA}")
          tags=""
          for tag in $(git tag --list 'skills/*/v*' 'rules/*/v*' 'profiles/*/v*'); do
            commit=$(git rev-list -1 "$tag")
            if echo "$pr_commits" | grep -q "$commit"; then
              tags="$tags $tag"
            fi
          done

          if [ -z "$tags" ]; then
            echo "No publishable tags found in this merge."
            exit 0
          fi

          for tag in $tags; do
            echo "Re-pushing tag: $tag"
            git push origin ":refs/tags/${tag}" 2>/dev/null || true
            git push origin "refs/tags/${tag}"
          done
